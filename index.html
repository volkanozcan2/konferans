<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konferans Salonu Rezervasyon</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260223-3" />
  </head>
  <body>
    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>

    <main class="app-shell">
      <section id="login-card" class="card auth-card hidden">
        <h1>Konferans Salonu Rezervasyon</h1>
        <form id="login-form" autocomplete="on">
          <label>
            E-posta
            <input id="email" name="email" type="email" required />
          </label>
          <label>
            Şifre
            <input id="password" name="password" type="password" required minlength="6" />
          </label>
          <button type="submit" class="btn btn-primary">Giriş Yap</button>
        </form>
      </section>

      <section id="app" class="hidden">
        <header class="topbar">
          <div>
            <h2>Haftalık Program</h2>
            <p id="week-label"></p>
          </div>
          <div class="controls">
            <button id="prev-week" class="btn btn-ghost" type="button">Önceki</button>
            <button id="today-week" class="btn btn-ghost" type="button">Bu Hafta</button>
            <button id="next-week" class="btn btn-ghost" type="button">Sonraki</button>
            <button id="logout-btn" class="btn btn-ghost" type="button">Çıkış</button>
          </div>
        </header>

        <section class="calendar card">
          <div id="calendar-grid" class="calendar-grid"></div>
        </section>
      </section>
    </main>

    <dialog id="reservation-modal" class="modal">
      <form id="reservation-form" method="dialog" class="modal-card">
        <h3 id="modal-title">Rezervasyon</h3>
        <input id="reservation-id" type="hidden" />
        <input id="reservation-date" type="hidden" />

        <label id="teacher-field">
          Öğretmen
          <input id="teacher-name" type="text" readonly />
        </label>

        <label id="event-field">
          İçerik / Etkinlik
          <input id="event-content" type="text" required minlength="2" placeholder="Etkinlik başlığı" />
        </label>

        <p id="slot-summary" class="slot-summary hidden"></p>
        <input id="reservation-start" type="hidden" />
        <input id="reservation-end" type="hidden" />

        <label id="lesson-count-field">
          Ders sayısı
          <input id="lesson-count" type="number" min="1" max="8" step="1" value="1" required />
        </label>

        <div class="modal-actions">
          <button id="delete-btn" type="button" class="btn btn-danger hidden">Sil</button>
          <button type="button" class="btn btn-ghost" id="cancel-btn">Vazgeç</button>
          <button id="submit-btn" type="submit" class="btn btn-primary">Kaydet</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-modal" class="modal">
      <form id="confirm-form" method="dialog" class="modal-card">
        <h3 id="confirm-title">Onay</h3>
        <p id="confirm-message">Devam etmek istiyor musunuz?</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="confirm-cancel">Vazgeç</button>
          <button type="button" class="btn btn-danger" id="confirm-ok">Sil</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
